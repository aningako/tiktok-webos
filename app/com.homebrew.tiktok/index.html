<!doctype html>
<html><head><meta charset="utf-8"><title>TikTok</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
h1{font-size:48px;margin:0 0 16px}#s{font-size:22px;opacity:.7;max-width:900px}#c{position:fixed;bottom:24px;font-size:16px;opacity:.45}
</style></head><body>
<h1>TikTok</h1><div id="s">Loading…</div>
<div id="c">Created by aning and Cipher Amir with the help of Claude · Made for Pie Amolong</div>
<script>
/* Start in TV mode: the app's own light player, which runs on a bare tiktok.com page (see tvMode in
   webOSUserScripts/userScript.js, which webOS injects into every page of this app). */
var TARGET = 'https://www.tiktok.com/robots.txt?tv=1', s = document.getElementById('s');
function go() {
  if (navigator.onLine === false) {
    s.textContent = 'No internet connection. Retrying…';
    return setTimeout(go, 3000);
  }
  location.replace(TARGET);
}
document.addEventListener('keydown', function (e) { if (e.keyCode === 461 || e.keyCode === 27) window.close(); });
go();
</script></body></html>
