<!doctype html>
<html><head><meta charset="utf-8"><title>TikTok</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
h1{font-size:64px;margin:0 0 20px}#s{font-size:28px;opacity:.7;max-width:1200px}
</style></head><body>
<h1>TikTok</h1><div id="s">Starting…</div>
<script>
var BASE = "http://127.0.0.1:8765", s = document.getElementById("s"), tries = 0, started = false, lastErr = "";
function luna(uri, params, cb) {
  try {
    var b = new PalmServiceBridge();
    b.onservicecallback = function (m) { try { cb && cb(JSON.parse(m)); } catch (e) {} };
    b.call(uri, JSON.stringify(params || {}));
  } catch (e) { lastErr = String(e); cb && cb({ returnValue: false, errorText: lastErr }); }
}
function ping() {
  var x = new XMLHttpRequest();
  x.open("GET", BASE + "/__ping?" + Date.now()); x.timeout = 1500;
  x.onload = function () { if (x.status === 200) { s.textContent = "Loading TikTok…"; location.replace(BASE + "/__shell"); } else retry(); };
  x.onerror = x.ontimeout = retry;
  x.send();
}
function retry() {
  tries++;
  if (tries > 40) { s.textContent = "Proxy service did not start. " + lastErr + " Check the service is installed (ares-install) and Developer Mode is on."; return; }
  if (tries % 4 === 1) luna("luna://com.homebrew.tiktok.proxy/start", {}, function (r) { if (!r.returnValue) lastErr = r.errorText || ""; });
  setTimeout(ping, 500);
}
document.addEventListener("keydown", function (e) { if (e.keyCode === 461 || e.keyCode === 27) window.close(); });
retry();
</script></body></html>
